# The basic colors
foreground              #D0D0D0
background              #212121
selection_foreground    #212121
selection_background    #424242

# Cursor colors
cursor                  #D0D0D0
cursor_text_color       #212121

# URL underline color when hovering with mouse
url_color               #6C99BB

# Kitty window border colors
active_border_color     #6C99BB
inactive_border_color   #424242
bell_border_color       #F7CA88

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #D0D0D0
active_tab_background   #424242
inactive_tab_foreground #8E8E8E
inactive_tab_background #2C2C2C
tab_bar_background      #1A1A1A

# Colors for marks (marked text in the terminal)
mark1_foreground #212121
mark1_background #6C99BB
mark2_foreground #212121
mark2_background #AC7BBA
mark3_foreground #212121
mark3_background #74C48C

