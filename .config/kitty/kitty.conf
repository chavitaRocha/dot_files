include light-theme.auto.conf
enabled_layouts splits:split_axis=horizontal
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}
term xterm-kitty

font_size 16.0
# font_family      JetBrains Mono
# bold_font        JetBrainsMono Nerd Font Mono Extra Bold
# bold_italic_font JetBrainsMono Nerd Font Mono Extra Bold Italic

# font_family Iosevka Term
# font_family Iosevka Nerd Font Mono
force_ltr yes
text_composition_strategy platform
# modify_font cell_width 100%
# modify_font cell_height 115%

modify_font cell_width 95%

# I was going crazy
# after a kitty update, font height seemed smaller, this fixed it
modify_font cell_height 5px

shell_integration no-cursor
enable_audio_bell no
mouse_hide_wait -1

background_opacity 0.95
# window_decoration none
# # dynamic_background_opacity yes
# hide_window_decorations titlebar-only
macos-titlebar-style hidden
sync_to_monitor yes

window_padding_width 0
background_blur 40
placement_strategy top

copy_on_select clipboard

shell_integration disabled
cursor_trail 10
cursor_trail_start_threshold 0
cursor_trail_decay 0.01 0.15
cursor_shape block

# clear_all_shortcuts yes

macos_option_as_alt yes

map cmd+0x45 change_font_size all +1.0
map cmd+0x4e change_font_size all -1.0

# map cmd+t send_text all \x00\x63

# map cmd+w send_text all \x00x
# map cmd+k send_text all \x00k

# map cmd+d send_text all \x00v
# map cmd+shift+d send_text all \x00"

# map cmd+z send_text all \x00z



# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMonoNL Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# wezterm keybindings
# Leader key is Ctrl+Space (matching wezterm's Ctrl+Space leader)

# Pane/Window navigation with Ctrl+h/j/k/l (wezterm nav.split_nav)
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right

# Leader+r: Enter resize mode (wezterm resize_mode key table)
map ctrl+space>r create_marker
map ctrl+space>r>h resize_window narrower 3
map ctrl+space>r>l resize_window wider 3
map ctrl+space>r>k resize_window taller 3
map ctrl+space>r>j resize_window shorter 3
map ctrl+space>r>escape no_op
map ctrl+space>r>q no_op

# Leader+h/l: Tab navigation (wezterm leader+h/l for ActivateTabRelative)
map ctrl+space>h previous_tab
map ctrl+space>l next_tab

# Leader+v: Copy/scrollback mode (wezterm leader+v for ActivateCopyMode)
map ctrl+space>v show_scrollback

# Leader+z: Zoom/toggle pane (wezterm leader+z for TogglePaneZoomState)
map ctrl+space>z toggle_layout stack

# Leader+t: Workspace/tab switcher with zoxide (wezterm workspace_switcher)
map ctrl+space>t launch --type=overlay ~/.config/kitty/kitty-sessionx/kitty-sessionx.sh

# Leader+,: Rename tab (wezterm leader+, for PromptInputLine tab name)
map ctrl+space>, set_tab_title

# Leader+Shift+h: Switch workspace relative (wezterm SwitchWorkspaceRelative)
map ctrl+space>shift+h move_tab_backward

# Leader+m: Rename workspace (wezterm workspace rename - using OS window title)
map ctrl+space>m set_window_title

# Leader+Shift+l: Toggle to last workspace (wezterm switch_to_previous_workspace)
map ctrl+space>shift+l goto_tab -1

# Copy/Paste (Ctrl+Shift+c/v - same as wezterm)
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Split horizontal (Cmd+d like wezterm SplitHorizontal)
map cmd+d launch --location=vsplit --cwd=current

# Split vertical (Cmd+Shift+d like wezterm SplitVertical)
map cmd+shift+d launch --location=hsplit --cwd=current

# Close window/pane (Cmd+w like wezterm CloseCurrentPane)
map cmd+w close_window

# Shift+Enter sends escape+return (like wezterm SendString)
map shift+enter send_text all \x1b\r
# wezterm keybindings
